# .github/workflows/build.yml
name: Build distributables

on:
  push:
    tags: [ '[0-9]*.[0-9]*', '[0-9]*.[0-9]*.[0-9]*' ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyside6 typing-extensions
      - run: pip install -e .
      - run: pyinstaller qtarmsim.spec
      - uses: actions/upload-artifact@v4
        with:
          name: qtarmsim-${{ matrix.os }}
          path: dist/
            
