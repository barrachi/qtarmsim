# .github/workflows/build.yml
name: Build distributables

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pyside6 typing-extensions
      - run: pip install -e .
      - run: pyinstaller --onefile --windowed --name qtarmsim src/qtarmsim/__init__.py
      - uses: actions/upload-artifact@v4
        with:
          path: dist/
            
